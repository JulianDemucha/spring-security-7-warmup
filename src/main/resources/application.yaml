app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: claims-app
    audience: claims-app-api
    cookie-secure: ${COOKIE_SECURE:true}
    access-cookie:
      name: access-token
      path: /
      same-site: Strict
      ttl: 15m
      http-only: true
    refresh-cookie:
      name: refresh-token
      path: /auth
      same-site: Strict
      ttl: 7d
      http-only: true

  xsrf:
    secret: ${XSRF_SECRET}
spring:
  application:
    name: project1
  datasource:
    url: jdbc:postgresql://localhost:5432/claims
    username: app
    password: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true